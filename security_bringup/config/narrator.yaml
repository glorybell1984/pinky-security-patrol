# Narrator: patrol events -> one short sentence per event, by map section.
#   "In section A, a suspicious object (#42) has been detected."
# An LLM writes the sentence through the provider set in llm_provider (claude:
# anthropic package + ANTHROPIC_API_KEY or "ant auth login"); without it, or on
# any error or timeout, a fixed template does. See docs/narrator.md.
narrator:
  ros__parameters:
    llm_provider: claude           # claude | none (templates only); more in narrator.PROVIDERS
    llm_model: claude-opus-5-5     # '' = the provider's default
    llm_effort: low                # one sentence: low effort is fast enough
    llm_timeout: 8.0               # s per request, then the template
    language: English
    # Sections of police_map2: three bands along the arena (A = dock end, C = far end).
    # Each zone: zone_corners points, x, y in the map frame, all zones in one list.
    zone_names: [A, B, C]
    zone_descriptions: [dock end, middle, far end]
    zone_corners: 4
    zone_polygons: [-1.76, -2.71, -0.58, -1.33, -3.78, 1.39, -4.95, 0.01, -0.58, -1.33, 0.59, 0.05, -2.60, 2.77, -3.78, 1.39, 0.59, 0.05, 1.77, 1.43, -1.42, 4.15, -2.60, 2.77]
