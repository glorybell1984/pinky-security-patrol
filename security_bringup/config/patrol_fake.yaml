# Traffic manager settings for the FAKE Pinky world (7 m x 5 m room, two boxes).
traffic_manager:
  ros__parameters:
    robot_id: pinky1
    namespace: ""
    global_frame: map
    base_frame: base_footprint
    waypoints: [1.0, 2.6, 0.0,
                3.3, 2.0, -90.0,
                6.0, 2.0, 90.0,
                5.0, 3.2, 180.0,
                1.0, 3.2, -90.0]
    nav_retry: 1
    waypoint_pause: 1.0
    pose_timeout: 3.0
    follow_update_period: 0.5
    follow_min_distance: 0.5
    follow_replan_distance: 0.2
