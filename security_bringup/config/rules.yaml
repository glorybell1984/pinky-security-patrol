# Task manager rules (thresholds for object states and robot reactions).
task_manager:
  ros__parameters:
    robot_id: pinky1
    same_object_radius: 0.3       # m, "same place" on a later pass
    moving_threshold: 0.3         # m away from the logged position
    moving_window: 2.0            # s
    moving_min_samples: 3         # detections beyond the threshold within the window
    episode_gap: 3.0              # s without detection that ends one sighting
    min_revisit_time: 20.0        # s between pass sightings before level 2
    moving_gap: 10.0              # s; found elsewhere this soon after a sighting = moving
    removed_frames: 15            # in-view frames without detection -> REMOVED
    view_distance: 0.5            # m, REMOVED is only judged this close: the 2.7 cm
                                  # object marker is not readable much farther (synthetic
                                  # test: 100 % up to 0.5 m, 40-65 % at 0.7-1.0 m).
                                  # With a 10 cm marker use 1.5. Fake Pinky: 2.0 (launch)
    camera_hfov: 1.0423           # rad, must match the perception setting (real camera, measured)
    follow_distance: 0.7          # m
    lost_timeout: 5.0             # s
    hold_duration: 5.0            # s, level 2 stop with blinking lamp
    auto_start_patrol: false      # real robot: press Start patrol (Fake Pinky: true, launch)
    log_dir: ~/patrol_logs

    # Battery. Voltage from battery_sampler.py on the robot (median of 5 s, 1 Hz);
    # Pinky's single readings jump 7.2-7.7 V with current bursts (2026-11-12).
    # TODO: battery type and full voltage -> battery_curve and the thresholds below.
    battery_enabled: true
    battery_voltage_topic: /battery/voltage_avg
    battery_raw_topic: /battery/voltage    # used only while no voltage_avg arrives
    battery_curve: [6.8, 0.0, 7.6, 100.0]  # voltage, percent pairs; now Pinky's own straight line
    # Go-home levels in percent of battery_curve (Pinky's own scale: 6.8 V = 0 %,
    # 7.6 V = 100 %). Pinky's maker advises keeping the battery above 70 %.
    battery_low_percent: 70.0       # 7.36 V: finish the current task, then go home
    battery_critical_percent: 60.0  # 7.28 V: stop and go home now
    battery_charged_percent: 100.0  # 7.60 V: charged, patrol again
    battery_hysteresis: 0.05        # V above "low" before it counts as recovered
    battery_charger_lift: 0.33      # charger lifts the reading 0.33 V (7.93 -> 7.60 V at unplug):
                                    # while charging, 'charged' needs 7.60 + 0.33 V
    # used only with the percents set to -1:
    battery_low_voltage: 7.0
    battery_critical_voltage: 6.8
    battery_charged_voltage: 8.0
    battery_window: 5               # median of the last 5 readings (1 per s)
    battery_confirm: 5              # readings in a row before the level changes (5 s)
    auto_resume_after_charge: true  # dock with contacts: leave the dock and patrol when charged
                                    # (false = cable charging: operator unplugs and restarts)

    # Energy (security_task_manager/energy_planner.py). Pinky's constant load (Pi 5, LiDAR,
    # camera, Wi-Fi) is most of the power, so a lap costs about drain rate x lap time.
    # Both are measured during the patrol; ~/patrol_logs/laps_<time>.csv has one row per lap.
    energy_lap_aware: true          # at a lap start: home now if this lap + the way home
                                    # would end below battery_low_percent (no half laps)
    energy_follow_check: true       # skip a follow that would take the battery below critical
    energy_home_seconds: 90.0       # guess until a trip home is timed (then the longest
                                    # of the last 5 trips is used)
    energy_follow_budget: 120.0     # s of following kept in reserve for one follow
    energy_settle_seconds: 300.0    # after charging the reading sinks ~0.1 V in 4 min: no rate
    energy_default_rate: 0.0        # V/min before it is measured (0 = unknown: plain 70 % rule)
    energy_default_lap_seconds: 0.0 # s before a lap is timed (0 = unknown)
