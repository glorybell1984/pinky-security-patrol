# Traffic manager for Fake Pinky in the real arena (police_map). The waypoints
# and dock are a DRAFT from the map's free space (checked: all reachable, the
# object is visible from WP3). Use them as a starting point for patrol.yaml.
traffic_manager:
  ros__parameters:
    robot_id: pinky1
    namespace: ""
    global_frame: map
    base_frame: base_footprint
    # The arena is one corridor (x 0.7-1.2) with open ends: out and back.
    waypoints: [0.50, 0.45, 0.0,       # WP1 bottom, near the dock
                1.00, 1.50, 90.0,      # WP2 up the corridor
                1.05, 3.30, 90.0,      # WP3 top end, faces object 42 (0.4 m ahead)
                0.60, 3.35, 180.0,     # WP4 top left
                1.00, 2.20, -90.0,     # WP5 back down
                0.95, 0.80, -90.0]     # WP6
    nav_retry: 1
    waypoint_pause: 1.0
    pose_timeout: 3.0
    follow_update_period: 0.5
    follow_min_distance: 0.5
    follow_replan_distance: 0.2
    charger_pose: [0.01, 0.10, 180.0]  # real dock (fake_police.yaml dock_pose)
    dock_enabled: true
    dock_docked_distance: 0.05
    dock_predock_distance: 0.35      # two-phase, as on the real robot
    dock_align_lateral_tolerance: 0.015
    dock_align_heading_tolerance_deg: 3.0
    start_docked: true
    charger_retries: 3
