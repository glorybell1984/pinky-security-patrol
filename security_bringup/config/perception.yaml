# Perception settings for the REAL Pinky Pro (laptop side).
# The robot publishes the camera with security_perception/camera_publisher.py
# (Pinky's own bringup has no camera node). Values below come from the
# pinky_pro URDF; still check them on the robot (docs/demo_guide.md).
perception:
  ros__parameters:
    # Camera: camera_publisher.py on the robot (ROS topic, default). Alternative:
    # camera_server.py (Flask MJPEG) with image_source: http, check http://<robot-ip>:5000/
    image_source: ros              # ros: camera_publisher.py (measured 15 Hz, frames carry capture time)
                                   # http: camera_server.py (no timestamps: frames skipped while turning)
    stream_url: http://192.168.14.80:5000/video_feed   # our Pinky (image_source: http only)
    max_turn_rate: 0.6             # rad/s: skip frames while the robot turns faster
    image_topic: /camera/image_raw/compressed
    image_compressed: true
    scan_topic: /scan
    global_frame: map
    base_frame: base_footprint     # Pinky URDF root; AMCL also uses it
    camera_hfov: 1.0423            # rad (59.7 deg), measured: marker 66 read 44.2 cm, ruler 50 cm
                                   # (the Pinky simulator camera is 66 deg / 1.1519)
    camera_offset_x: 0.035         # m, front_camera_link ahead of base_link (URDF)
    camera_flip: false             # true if the image is upside down
    aruco_dictionary: DICT_5X5_100 # the printed demo markers (IDs 0-99)
    dock_marker_id: 66             # marker on the charging dock (never a suspicious object)
    dock_marker_size: 0.04         # m, black square side of marker 66 as printed
    marker_size: 0.027             # m, black square side of the object markers (42) as printed
    distance_source: auto          # auto | lidar | marker_size
    lidar_window_deg: 3.0
    lidar_yaw_from_tf: true        # rplidar_link is turned 180 deg in the URDF
    lidar_yaw_offset: 3.14159      # used only if TF has no LiDAR frame
    max_detect_distance: 1.0       # m, objects only (the dock is separate). The 2.7 cm
                                   # marker is unreliable beyond ~0.6 m; rare far sightings
                                   # would log noisy positions. 10 cm marker: 2.5
    process_rate: 10.0
    debug_image: true
    debug_rate: 5.0
